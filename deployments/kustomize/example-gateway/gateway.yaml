# ПРИМЕР, а не часть base. Gateway почти всегда принадлежит кластерной
# инфраструктуре и живёт в своём namespace со своим жизненным циклом —
# приложение к нему только присоединяется через parentRefs. Кладите этот
# файл в репозиторий платформы, а не сюда, если Gateway у вас уже есть.
#
# Здесь он лежит ради одной вещи, которую важно не потерять: TLS
# терминируется ИМЕННО ЗДЕСЬ. Оба секрета yt-mcp едут в заголовках
# (Authorization и X-YouTrack-Token), поэтому открытый HTTP до пода
# недопустим, а сам сервер TLS не умеет и уметь не должен.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
spec:
  gatewayClassName: REPLACE-WITH-YOUR-GATEWAY-CLASS
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: mcp.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: mcp-example-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: yt-mcp
