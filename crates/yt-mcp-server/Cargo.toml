[package]
name = "yt-mcp-server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# mcp server
rmcp = { workspace = true, default-features = true, features = [
    "server",
    "transport-streamable-http-server",
] }

# youtrack
yt-mcp-core = { workspace = true }
yt-client = { workspace = true }

# http server
axum = { workspace = true, default-features = true }

# async runtime
tokio = { workspace = true, default-features = true, features = ["rt", "rt-multi-thread", "net", "macros"] }

# error handling
anyhow = { workspace = true }

# разбор redirect URI
url = { workspace = true }

# http-клиент для обнаружения Hub и обмена кодов
reqwest = { workspace = true, features = ["rustls", "json", "form"] }

# JSON-ответы Hub
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

# случайный state и его кодирование
getrandom = "0.4"
base64 = { workspace = true }

# constant-time secret comparison
subtle = { workspace = true }

# logs
tracing = { workspace = true, default-features = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = { workspace = true }
